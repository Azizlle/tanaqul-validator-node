name: Build & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
        env:
          TANAQUL_VALIDATOR_ID: ci
          TANAQUL_API_KEY: ci
          TANAQUL_BACKEND_URL: https://example.test

  # ⛔ TAGS ONLY — a merge must not be a publish.
  #
  # This used to fire on every push to `main`, and `latest` was stamped by
  # `enable={{is_default_branch}}`. So merging ANY commit — a test file, a README line —
  # republished `ghcr.io/azizlle/tanaqul-validator-node:latest`, the image that signs
  # blocks, as a side effect of the merge. It also broke the one string that identifies
  # what a node is running: `config.NODE_VERSION` is hand-edited, so a rebuilt `latest`
  # kept reporting the version of the tag it no longer contained.
  #
  # Shipping the image that signs your blocks is an explicit act: push a `v*` tag.
  build-and-push:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/azizlle/tanaqul-validator-node
          # `latest` is unconditional because this job now runs ONLY on a v* tag.
          # `enable={{is_default_branch}}` would be false on every tag build, so `latest`
          # would freeze forever — a dead rule that reads as a live one.
          # ⚠️ Nothing but tag patterns inside the block scalar below: a `#` line there is
          # a VALUE, not a comment, and metadata-action would take it as a tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
